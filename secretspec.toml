[project]
name = "docker-solidcraft"
revision = "1.0"

[providers]
vault = { uri = "vault:///secret" }
vault_approle = { uri = "vault:///secret?auth=approle" }

[default]
providers = ["vault"]

[profiles.default]
CI_REGISTRY_USER = { description = "CI OCI registry username", required = false, default = "sa-publish-packages" }
CI_REGISTRY_TOKEN = { description = "CI OCI registry token", required = false }

[scopes.ci]
secrets = ["CI_REGISTRY_USER", "CI_REGISTRY_TOKEN"]
