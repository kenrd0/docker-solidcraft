---
services:
  solidcraft:
    image: solidcraft:local
    build:
      context: ./docker
      args:
        SOLIDCRAFT_VERSION: ${SOLIDCRAFT_VERSION:-0.30.0}
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - solidcraft-config:/config
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  solidcraft-config:
